# 手动触发：用 miniprogram-ci 上传开发版（再去公众平台设体验版）
name: mp-upload

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（留空则用时间戳）
        required: false
        type: string
      desc:
        description: 版本说明
        required: false
        default: GitHub Actions upload
        type: string
      robot:
        description: CI 机器人编号 1-30
        required: false
        default: '1'
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Static checks
        run: |
          npm run test:cloud
          npm test

      - name: Write upload private key
        env:
          MP_CI_PRIVATE_KEY: ${{ secrets.MP_CI_PRIVATE_KEY }}
        run: |
          mkdir -p secrets
          if [ -z "$MP_CI_PRIVATE_KEY" ]; then
            echo "缺少 Secret: MP_CI_PRIVATE_KEY"
            exit 1
          fi
          printf '%s\n' "$MP_CI_PRIVATE_KEY" > secrets/private.wx61ad70ac766e4a04.key

      - name: Upload
        env:
          MP_CI_VERSION: ${{ inputs.version }}
          MP_CI_DESC: ${{ inputs.desc }}
          MP_CI_ROBOT: ${{ inputs.robot }}
        run: npm run mp:upload

      - name: Reminder
        run: echo "上传的是开发版本。请到微信公众平台 → 版本管理 → 选为体验版。"
