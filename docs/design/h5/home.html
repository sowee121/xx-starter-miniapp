<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=750" />
    <title>嘻嘻启蒙乐园 · 首页</title>
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body>
    <div class="page">
      <div class="scene" aria-hidden="true">
        <img class="scene__meadow" src="../atoms/meadow-hill.png" alt="" />
        <div class="scene__blend"></div>
        <div class="scene__dusk"></div>
      </div>

      <div class="shell">
        <!-- 自定义导航 --size-header 88rpx：左标题，右积分（落在胶囊左侧安全区） -->
        <div class="custom-header__row">
          <div class="custom-header__brand">嘻嘻启蒙乐园</div>
          <div class="custom-header__right">
            <div class="star-bar">
              <img class="star-bar__icon" src="../atoms/star.png" alt="" />
              <span class="star-bar__count">128</span>
            </div>
            <div class="capsule-slot" data-href="index.html"></div>
          </div>
        </div>

        <!-- 首页独有欢迎卡 -->
        <div class="hello-card block tone-cream" data-href="parent.html">
          <div class="hello-card__avatar-slot">
            <img class="hello-card__avatar" src="../atoms/avatar.png" alt="" />
          </div>
          <div class="hello-card__body">
            <div class="hello-card__hello">宝贝，你好呀</div>
            <div class="hello-card__sub">一起快乐学习吧～</div>
          </div>
          <img class="hello-card__deco" src="../atoms/daisy-sprig.png" alt="" />
        </div>

        <!-- 通栏：每日任务（星星凹槽进度） -->
        <div class="feature-card block tone-matcha" data-href="task/list.html">
          <img class="feature-card__mascot" src="../atoms/dino.png" alt="" />
          <div class="feature-card__body">
            <div class="feature-card__title">每日任务</div>
            <div class="feature-card__sockets">
              <div class="feature-card__socket is-on">
                <img class="feature-card__socket-star" src="../atoms/star.png" alt="" />
              </div>
              <div class="feature-card__socket is-on">
                <img class="feature-card__socket-star" src="../atoms/star.png" alt="" />
              </div>
              <div class="feature-card__socket is-on">
                <img class="feature-card__socket-star" src="../atoms/star.png" alt="" />
              </div>
              <div class="feature-card__socket"></div>
              <div class="feature-card__socket"></div>
              <div class="feature-card__socket"></div>
            </div>
          </div>
          <img class="feature-card__deco" src="../atoms/check.png" alt="" />
        </div>

        <!-- 通栏：积分商城 -->
        <div class="feature-card feature-card--shop block tone-rose" data-href="reward/shop.html">
          <img class="feature-card__mascot" src="../atoms/unicorn.png" alt="" />
          <div class="feature-card__body">
            <div class="feature-card__title">积分商城</div>
            <div class="feature-card__sub">星星兑换动物贴纸</div>
          </div>
          <img class="feature-card__deco" src="../atoms/big-star.png" alt="" />
        </div>

        <!-- 六个学习积木：一卡一色 -->
        <div class="home-modules">
          <div
            class="home-modules__cell module-card block tone-butter"
            data-href="pinyin/list.html"
          >
            <img class="module-card__mascot" src="../atoms/duckling.png" alt="" />
            <div class="module-card__label">拼音</div>
          </div>
          <div class="home-modules__cell module-card block tone-tan" data-href="english/hub.html">
            <img class="module-card__mascot" src="../atoms/bear.png" alt="" />
            <div class="module-card__label">英语</div>
          </div>
          <div class="home-modules__cell module-card block tone-orange" data-href="hanzi/list.html">
            <img class="module-card__mascot" src="../atoms/cat.png" alt="" />
            <div class="module-card__label">识字</div>
          </div>
          <div class="home-modules__cell module-card block tone-coral" data-href="poem/list.html">
            <img class="module-card__mascot" src="../atoms/rabbit.png" alt="" />
            <div class="module-card__label">古诗</div>
          </div>
          <div class="home-modules__cell module-card block tone-sand" data-href="math/hub.html">
            <img class="module-card__mascot" src="../atoms/dog.png" alt="" />
            <div class="module-card__label">算术</div>
          </div>
          <div
            class="home-modules__cell module-card block tone-frost"
            data-href="calendar/day.html"
          >
            <img class="module-card__mascot" src="../atoms/penguin.png" alt="" />
            <div class="module-card__label">日历</div>
          </div>
        </div>
      </div>
    </div>
    <script src="js/nav.js"></script>
  </body>
</html>
