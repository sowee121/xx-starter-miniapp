<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=750" />
    <title>嘻嘻启蒙乐园 · 拼音</title>
    <link rel="stylesheet" href="../css/pages.css" />
  </head>
  <body>
    <div class="page">
      <div class="scene" aria-hidden="true">
        <img class="scene__meadow" src="../../atoms/meadow-hill.png" alt="" />
        <div class="scene__blend"></div>
      </div>
      <div class="shell">
        <div class="nav">
          <div class="nav-home" aria-label="返回首页">
            <img class="nav-home__icon" src="../../atoms/home-clay.png" alt="" />
          </div>
          <div class="nav-title">拼音</div>
          <div class="nav-right">
            <div class="star-pill"><img src="../../atoms/star.png" alt="" /><b>128</b></div>
            <div class="capsule-slot"></div>
          </div>
        </div>
        <div class="detail-stack">
          <div class="detail-big block tone-cream">
            <img class="pinyin-vowel-image" src="../../atoms/pinyin-a.png" alt="a" />
            <p>/ɑ/</p>
            <div class="play-btn is-lg" aria-label="播放">
              <img src="../../atoms/play.png" alt="" />
            </div>
          </div>
          <div class="buddy-dock block tone-cream">
            <img class="buddy-dock__mascot" src="../../atoms/buddy-duckling.png" alt="" />
            <div class="buddy-dock__bubble">张大嘴巴，a a a</div>
          </div>
          <nav class="trail-nav" aria-label="韵母石子径">
            <span class="trail-nav__item is-current" aria-current="true"
              ><span class="trail-nav__glyph">a</span></span
            ><span class="trail-nav__item"><span class="trail-nav__glyph">o</span></span
            ><span class="trail-nav__item"><span class="trail-nav__glyph">e</span></span
            ><span class="trail-nav__item"><span class="trail-nav__glyph">i</span></span
            ><span class="trail-nav__item"><span class="trail-nav__glyph">u</span></span
            ><span class="trail-nav__item"><span class="trail-nav__glyph">ü</span></span>
          </nav>
        </div>
        <div class="section" id="o">
          <div class="section-title">o（对照）</div>
          <div class="detail-stack">
            <div class="detail-big block tone-cream">
              <img class="pinyin-vowel-image" src="../../atoms/pinyin-o.png" alt="o" />
              <p>/o/</p>
              <div class="play-btn is-lg" aria-label="播放">
                <img src="../../atoms/play.png" alt="" />
              </div>
            </div>
            <div class="buddy-dock block tone-cream">
              <img class="buddy-dock__mascot" src="../../atoms/buddy-duckling.png" alt="" />
              <div class="buddy-dock__bubble">圆圆嘴巴，o o o</div>
            </div>
          </div>
        </div>
        <div class="section">
          <div class="section-title">语音准备中</div>
          <div class="soft-note block tone-butter is-shaking">语音准备中～</div>
        </div>
      </div>
    </div>
  </body>
</html>
