<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=750" />
    <title>嘻嘻启蒙乐园 · 拼音</title>
    <link rel="stylesheet" href="../css/pages.css" />
  </head>
  <body>
    <div class="page">
      <div class="scene" aria-hidden="true">
        <img class="scene__meadow" src="../../atoms/meadow-hill.png" alt="" />
        <div class="scene__blend"></div>
      </div>
      <div class="shell">
        <div class="nav">
          <div class="nav-home" aria-label="返回首页">
            <img class="nav-home__icon" src="../../atoms/home-clay.png" alt="" />
          </div>
          <div class="nav-title">拼音</div>
          <div class="nav-right">
            <div class="star-pill"><img src="../../atoms/star.png" alt="" /><b>128</b></div>
            <div class="capsule-slot"></div>
          </div>
        </div>
        <div class="inner-head">
          <h1>单韵母</h1>
          <p>听一听小声音</p>
        </div>
        <div class="word-grid">
          <div class="word-card block tone-cream">
            <img class="word-card__image" src="../../atoms/pinyin-a.png" alt="a" />
            <div class="play-btn is-sm" aria-label="播放">
              <img src="../../atoms/play.png" alt="" />
            </div>
          </div>
          <div class="word-card block tone-cream">
            <img class="word-card__image" src="../../atoms/pinyin-o.png" alt="o" />
            <div class="play-btn is-sm" aria-label="播放">
              <img src="../../atoms/play.png" alt="" />
            </div>
          </div>
          <div class="word-card block tone-cream">
            <img class="word-card__image" src="../../atoms/pinyin-e.png" alt="e" />
            <div class="play-btn is-sm" aria-label="播放">
              <img src="../../atoms/play.png" alt="" />
            </div>
          </div>
          <div class="word-card block tone-cream">
            <img class="word-card__image" src="../../atoms/pinyin-i.png" alt="i" />
            <div class="play-btn is-sm" aria-label="播放">
              <img src="../../atoms/play.png" alt="" />
            </div>
          </div>
          <div class="word-card block tone-cream">
            <img class="word-card__image" src="../../atoms/pinyin-u.png" alt="u" />
            <div class="play-btn is-sm" aria-label="播放">
              <img src="../../atoms/play.png" alt="" />
            </div>
          </div>
          <div class="word-card block tone-cream">
            <img class="word-card__image" src="../../atoms/pinyin-umlaut-u.png" alt="ü" />
            <div class="play-btn is-sm" aria-label="播放">
              <img src="../../atoms/play.png" alt="" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
