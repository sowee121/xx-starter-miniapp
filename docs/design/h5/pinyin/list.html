<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=750" />
    <title>嘻嘻启蒙乐园 · 拼音</title>
    <link rel="stylesheet" href="../css/pages.css" />
  </head>
  <body>
    <div class="page">
      <div class="scene" aria-hidden="true">
        <img class="scene__meadow" src="../../atoms/meadow-hill.png" alt="" />
        <div class="scene__blend"></div>
      </div>
      <div class="shell">
        <div class="custom-header__row">
          <div class="custom-header__home" aria-label="返回首页" data-href="../home.html">
            <img class="custom-header__home-icon" src="../../atoms/home-clay.png" alt="" />
          </div>
          <div class="custom-header__title">拼音</div>
          <div class="custom-header__right">
            <div class="star-bar">
              <img class="star-bar__icon" src="../../atoms/star.png" alt="" /><b
                class="star-bar__count"
                >128</b
              >
            </div>
            <div class="capsule-slot" data-href="../index.html"></div>
          </div>
        </div>
        <div class="inner-head">
          <h1>单韵母</h1>
          <p>听一听，练发音</p>
        </div>
        <div class="word-grid" data-href="detail.html">
          <div class="word-card block tone-cream">
            <img class="word-card__image" src="../../atoms/pinyin-a.png" alt="a" />
            <div class="play-btn is-sm" aria-label="播放">
              <img src="../../atoms/play.png" alt="" />
            </div>
          </div>
          <div class="word-card block tone-cream">
            <img class="word-card__image" src="../../atoms/pinyin-o.png" alt="o" />
            <div class="play-btn is-sm" aria-label="播放">
              <img src="../../atoms/play.png" alt="" />
            </div>
          </div>
          <div class="word-card block tone-cream">
            <img class="word-card__image" src="../../atoms/pinyin-e.png" alt="e" />
            <div class="play-btn is-sm" aria-label="播放">
              <img src="../../atoms/play.png" alt="" />
            </div>
          </div>
          <div class="word-card block tone-cream">
            <img class="word-card__image" src="../../atoms/pinyin-i.png" alt="i" />
            <div class="play-btn is-sm" aria-label="播放">
              <img src="../../atoms/play.png" alt="" />
            </div>
          </div>
          <div class="word-card block tone-cream">
            <img class="word-card__image" src="../../atoms/pinyin-u.png" alt="u" />
            <div class="play-btn is-sm" aria-label="播放">
              <img src="../../atoms/play.png" alt="" />
            </div>
          </div>
          <div class="word-card block tone-cream">
            <img class="word-card__image" src="../../atoms/pinyin-umlaut-u.png" alt="ü" />
            <div class="play-btn is-sm" aria-label="播放">
              <img src="../../atoms/play.png" alt="" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="../js/nav.js"></script>
  </body>
</html>
