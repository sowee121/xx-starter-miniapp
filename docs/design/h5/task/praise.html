<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=750" />
  <title>嘻嘻启蒙乐园 · 日历 · 任务完成</title>
  <link rel="stylesheet" href="../css/pages.css" />
</head>
<body>
  <div class="page">
    <img class="page-bg" src="../../atoms/meadow.png" alt="" />
    <div class="shell">
      <div class="nav">
        <div class="nav-home" aria-label="返回首页"></div>
        <div class="nav-title">日历</div>
        <div class="nav-right"><div class="star-pill"><img src="../../atoms/star.png" alt="" /><b>128</b></div><div class="capsule-slot"></div></div>
      </div>
      <div class="calendar-scene block tone-butter"><div class="calendar-sky-icon"><img src="../../atoms/sun.png" alt="" /></div><div class="calendar-date">2026年8月15日</div><div class="calendar-week">星期六</div><div class="calendar-tag">白天</div></div>
    </div>
    <div class="praise-sun" role="dialog" aria-label="任务完成">
      <div class="praise-sun__card">
        <img class="praise-sun__cloud" src="../../atoms/cloud.png" alt="" />
        <div class="praise-sun__icon-slot">
          <img class="praise-sun__icon" src="../../atoms/big-star.png" alt="" />
        </div>
        <div class="praise-sun__copy">
          <h1 class="praise-sun__text">宝贝真棒！</h1>
          <p class="praise-sun__desc">「看一看日历」任务完成啦～</p>
        </div>
        <div class="praise-sun__continue">继续玩</div>
        <img class="praise-sun__grass" src="../../atoms/grass-tuft.png" alt="" />
      </div>
    </div>
  </div>
</body>
</html>
