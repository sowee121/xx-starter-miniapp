<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=750" />
    <title>嘻嘻启蒙乐园 · 日历 · 白天</title>
    <link rel="stylesheet" href="../css/pages.css" />
  </head>
  <body>
    <div class="page">
      <div class="scene" aria-hidden="true">
        <img class="scene__meadow" src="../../atoms/meadow-hill.png" alt="" />
        <div class="scene__blend"></div>
      </div>
      <div class="shell">
        <div class="custom-header__row">
          <div class="custom-header__home" aria-label="返回首页" data-href="../home.html">
            <img class="custom-header__home-icon" src="../../atoms/home-clay.png" alt="" />
          </div>
          <div class="custom-header__title">日历</div>
          <div class="custom-header__right">
            <div class="star-bar">
              <img class="star-bar__icon" src="../../atoms/star.png" alt="" /><b
                class="star-bar__count"
                >128</b
              >
            </div>
            <div class="capsule-slot" data-href="../index.html"></div>
          </div>
        </div>
        <div class="calendar-scene block tone-butter">
          <div class="calendar-scene__sky">
            <img class="calendar-scene__sky-image" src="../../atoms/sun.png" alt="" />
          </div>
          <div class="calendar-scene__today">
            <div class="calendar-scene__date">2026 年 8 月 15 日</div>
            <div class="calendar-scene__week">星期六</div>
          </div>
          <div class="block-btn">打卡</div>
        </div>
        <div class="heat block tone-cream">
          <div class="heat__title">八月学习</div>
          <div class="heat__week">
            <div class="heat__wd">一</div>
            <div class="heat__wd">二</div>
            <div class="heat__wd">三</div>
            <div class="heat__wd">四</div>
            <div class="heat__wd">五</div>
            <div class="heat__wd">六</div>
            <div class="heat__wd">日</div>
          </div>
          <div class="heat__grid">
            <div class="heat__cell is-pad"></div>
            <div class="heat__cell is-pad"></div>
            <div class="heat__cell is-pad"></div>
            <div class="heat__cell is-pad"></div>
            <div class="heat__cell is-pad"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv2"></div>
            <div class="heat__cell is-lv0"></div>
            <div class="heat__cell is-lv2"></div>
            <div class="heat__cell is-lv3"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv0"></div>
            <div class="heat__cell is-lv4"></div>
            <div class="heat__cell is-lv2"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv3"></div>
            <div class="heat__cell is-lv2"></div>
            <div class="heat__cell is-lv0"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv4 is-today"></div>
            <div class="heat__cell is-lv2"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv0"></div>
            <div class="heat__cell is-lv3"></div>
            <div class="heat__cell is-lv2"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv0"></div>
            <div class="heat__cell is-lv2"></div>
            <div class="heat__cell is-lv3"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv4"></div>
            <div class="heat__cell is-lv2"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv0"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv2"></div>
          </div>
          <div class="heat__legend">
            <div class="heat__legend-label">少</div>
            <div class="heat__cell is-lv0"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv2"></div>
            <div class="heat__cell is-lv3"></div>
            <div class="heat__cell is-lv4"></div>
            <div class="heat__legend-label">多</div>
          </div>
        </div>
      </div>
    </div>
    <script src="../js/nav.js"></script>
  </body>
</html>
