<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=750" />
    <title>嘻嘻启蒙乐园 · 日历 · 晚上</title>
    <link rel="stylesheet" href="../css/pages.css" />
  </head>
  <body>
    <div class="page is-night">
      <div class="scene" aria-hidden="true">
        <img class="scene__meadow" src="../../atoms/meadow-hill.png" alt="" />
        <div class="scene__blend"></div>
      </div>
      <div class="shell">
        <div class="nav">
          <div class="nav-home" aria-label="返回首页">
            <img class="nav-home__icon" src="../../atoms/home-clay.png" alt="" />
          </div>
          <div class="nav-title">日历</div>
          <div class="nav-right">
            <div class="star-pill"><img src="../../atoms/star.png" alt="" /><b>128</b></div>
            <div class="capsule-slot"></div>
          </div>
        </div>
        <div class="calendar-scene calendar-scene-night block tone-night">
          <div class="calendar-sky-icon"><img src="../../atoms/moon-stars.png" alt="" /></div>
          <div class="calendar-today">
            <div class="calendar-date">2026 年 8 月 15 日</div>
            <div class="calendar-week">星期六</div>
          </div>
          <div class="big-btn is-disabled">今天已打卡</div>
        </div>
        <div class="heat block tone-night">
          <div class="heat__title">八月学习</div>
          <div class="heat__week">
            <div class="heat__wd">一</div>
            <div class="heat__wd">二</div>
            <div class="heat__wd">三</div>
            <div class="heat__wd">四</div>
            <div class="heat__wd">五</div>
            <div class="heat__wd">六</div>
            <div class="heat__wd">日</div>
          </div>
          <div class="heat__grid">
            <div class="heat__cell is-pad"></div>
            <div class="heat__cell is-pad"></div>
            <div class="heat__cell is-pad"></div>
            <div class="heat__cell is-pad"></div>
            <div class="heat__cell is-pad"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv2"></div>
            <div class="heat__cell is-lv0"></div>
            <div class="heat__cell is-lv2"></div>
            <div class="heat__cell is-lv3"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv0"></div>
            <div class="heat__cell is-lv4"></div>
            <div class="heat__cell is-lv2"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv3"></div>
            <div class="heat__cell is-lv2"></div>
            <div class="heat__cell is-lv0"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv4 is-today"></div>
            <div class="heat__cell is-lv2"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv0"></div>
            <div class="heat__cell is-lv3"></div>
            <div class="heat__cell is-lv2"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv0"></div>
            <div class="heat__cell is-lv2"></div>
            <div class="heat__cell is-lv3"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv4"></div>
            <div class="heat__cell is-lv2"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv0"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv2"></div>
          </div>
          <div class="heat__legend">
            <div class="heat__legend-label">少</div>
            <div class="heat__cell is-lv0"></div>
            <div class="heat__cell is-lv1"></div>
            <div class="heat__cell is-lv2"></div>
            <div class="heat__cell is-lv3"></div>
            <div class="heat__cell is-lv4"></div>
            <div class="heat__legend-label">多</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
