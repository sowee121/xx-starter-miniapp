<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=750" />
  <title>嘻嘻启蒙乐园 · 兑换成功弹层</title>
  <link rel="stylesheet" href="../css/pages.css" />
</head>
<body>
  <div class="page">
    <img class="page-bg" src="../../atoms/meadow.png" alt="" />
    <div class="shell">
      <div class="nav">
        <div class="nav-home" aria-label="返回首页"></div>
        <div class="nav-title">积分商城</div>
        <div class="nav-right"><div class="star-pill"><img src="../../atoms/star.png" alt="" /><b>128</b></div><div class="capsule-slot"></div></div>
      </div>
      <div class="inner-head"><h1>动物贴纸</h1><p>用星星兑换喜欢的贴纸</p></div>
      <div class="sticker-grid">
        <div class="sticker-card block tone-rose"><img src="../../atoms/sticker-hamster.png" alt="小仓鼠" /><span class="sticker-price"><b>2</b><img src="../../atoms/star.png" alt="星星" /></span><div class="chip is-compact">兑换</div></div>
        <div class="sticker-card block tone-sky"><img src="../../atoms/sticker-rabbit.png" alt="小兔" /><span class="sticker-price"><b>2</b><img src="../../atoms/star.png" alt="星星" /></span><div class="chip is-compact">兑换</div></div>
        <div class="sticker-card block tone-butter"><img src="../../atoms/sticker-dog.png" alt="小狗" /><span class="sticker-price"><b>2</b><img src="../../atoms/star.png" alt="星星" /></span><div class="chip is-compact">兑换</div></div>
      </div>
    </div>
    <div class="praise-sun" role="dialog" aria-label="兑换成功">
      <div class="praise-sun__card is-exchange">
        <img class="praise-sun__cloud" src="../../atoms/cloud.png" alt="" />
        <div class="praise-sun__icon-slot">
          <img class="praise-sun__icon" src="../../atoms/big-star.png" alt="" />
        </div>
        <div class="praise-sun__copy">
          <h1 class="praise-sun__text">兑换成功！</h1>
          <p class="praise-sun__desc">新的动物贴纸送给你～</p>
        </div>
        <div class="praise-sun__continue">继续玩</div>
        <img class="praise-sun__grass" src="../../atoms/grass-tuft.png" alt="" />
      </div>
    </div>
  </div>
</body>
</html>
