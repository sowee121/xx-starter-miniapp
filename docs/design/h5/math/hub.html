<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=750" />
    <title>嘻嘻启蒙乐园 · 算术</title>
    <link rel="stylesheet" href="../css/pages.css" />
  </head>
  <body>
    <div class="page">
      <div class="scene" aria-hidden="true">
        <img class="scene__meadow" src="../../atoms/meadow-hill.png" alt="" />
        <div class="scene__blend"></div>
      </div>
      <div class="shell">
        <div class="custom-header__row">
          <div class="custom-header__home" aria-label="返回首页" data-href="../home.html">
            <img class="custom-header__home-icon" src="../../atoms/home-clay.png" alt="" />
          </div>
          <div class="custom-header__title">算术</div>
          <div class="custom-header__right">
            <div class="star-bar">
              <img class="star-bar__icon" src="../../atoms/star.png" alt="" /><b
                class="star-bar__count"
                >128</b
              >
            </div>
            <div class="capsule-slot" data-href="../index.html"></div>
          </div>
        </div>
        <div class="inner-head">
          <h1>小小数学家</h1>
          <p>数一数，算一算</p>
        </div>
        <div class="entry-grid">
          <div class="entry-card block tone-rose" data-href="count.html">
            <img class="entry-card__image" src="../../atoms/english-fruit-apple.png" alt="" />
            <strong class="entry-card__title">数一数</strong>
            <span class="entry-card__sub">1 ~ 10</span>
            <span class="entry-card__desc">数苹果，认数字</span>
          </div>
          <div class="entry-card block tone-sand" data-href="calc.html">
            <img class="entry-card__image" src="../../atoms/dog.png" alt="" />
            <strong class="entry-card__title">算一算</strong>
            <span class="entry-card__sub">1 ~ 10</span>
            <span class="entry-card__desc">算多少，学加减</span>
          </div>
        </div>
      </div>
    </div>
    <script src="../js/nav.js"></script>
  </body>
</html>
