<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=750" />
    <title>嘻嘻启蒙乐园 · 英语</title>
    <link rel="stylesheet" href="../css/pages.css" />
  </head>
  <body>
    <div class="page">
      <div class="scene" aria-hidden="true">
        <img class="scene__meadow" src="../../atoms/meadow-hill.png" alt="" />
        <div class="scene__blend"></div>
      </div>
      <div class="shell">
        <div class="custom-header__row">
          <div class="custom-header__home" aria-label="返回首页">
            <img class="custom-header__home-icon" src="../../atoms/home-clay.png" alt="" />
          </div>
          <div class="custom-header__title">英语</div>
          <div class="custom-header__right">
            <div class="star-bar">
              <img class="star-bar__icon" src="../../atoms/star.png" alt="" /><b
                class="star-bar__count"
                >128</b
              >
            </div>
            <div class="capsule-slot"></div>
          </div>
        </div>
        <div class="detail-stack">
          <div class="detail-card block tone-sky">
            <img class="detail-card__image--wide" src="../../atoms/english-letter-a.png" alt="A" />
            <p class="detail-card__sub">/eɪ/</p>
            <div class="play-btn is-lg" aria-label="播放">
              <img src="../../atoms/play.png" alt="" />
            </div>
          </div>
          <nav class="trail-nav is-step" aria-label="切题">
            <span class="trail-nav__item is-disabled" aria-label="上一题"
              ><img class="trail-nav__arrow is-flip" src="../../atoms/arrow.png" alt="" /></span
            ><span class="trail-nav__item" aria-label="下一题"
              ><img class="trail-nav__arrow" src="../../atoms/arrow.png" alt=""
            /></span>
          </nav>
        </div>
        <div class="section">
          <div class="section-title">语音准备中</div>
          <div class="soft-note block tone-butter">语音准备中～</div>
        </div>
      </div>
    </div>
  </body>
</html>
