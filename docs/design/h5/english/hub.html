<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=750" />
    <title>嘻嘻启蒙乐园 · 英语</title>
    <link rel="stylesheet" href="../css/pages.css" />
  </head>
  <body>
    <div class="page">
      <div class="scene" aria-hidden="true">
        <img class="scene__meadow" src="../../atoms/meadow-hill.png" alt="" />
        <div class="scene__blend"></div>
      </div>
      <div class="shell">
        <div class="custom-header__row">
          <div class="custom-header__home" aria-label="返回首页" data-href="../home.html">
            <img class="custom-header__home-icon" src="../../atoms/home-clay.png" alt="" />
          </div>
          <div class="custom-header__title">英语</div>
          <div class="custom-header__right">
            <div class="star-bar">
              <img class="star-bar__icon" src="../../atoms/star.png" alt="" /><b
                class="star-bar__count"
                >128</b
              >
            </div>
            <div class="capsule-slot" data-href="../index.html"></div>
          </div>
        </div>
        <div class="inner-head">
          <h1>英语小天地</h1>
          <p>字母表，学单词</p>
        </div>
        <div class="entry-grid">
          <div class="entry-card block tone-sky" data-href="alphabet-list.html">
            <img class="entry-card__image" src="../../atoms/english-letter-a.png" alt="" />
            <div class="entry-card__text">
              <strong class="entry-card__title">字母表</strong>
              <span class="entry-card__sub">A ~ Z</span>
              <span class="entry-card__desc">识字母，唱儿歌</span>
            </div>
          </div>
          <div class="entry-card block tone-rose" data-href="list.html">
            <img class="entry-card__image" src="../../atoms/english-fruit-apple.png" alt="" />
            <div class="entry-card__text">
              <strong class="entry-card__title">单词</strong>
              <span class="entry-card__sub">生活常见词</span>
              <span class="entry-card__desc">学单词，练口语</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="../js/nav.js"></script>
  </body>
</html>
