# 示例：GitHub Actions 手动上传小程序开发版
# 使用方式：复制到仓库 `.github/workflows/mp-upload.yml`
# （需具备 workflow 权限的 token / PAT 才能推送该路径）
#
# 仓库 Secrets 需配置：MP_CI_PRIVATE_KEY = 私钥全文
name: mp-upload

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（留空则用脚本默认 1.0.0）
        required: false
        type: string
      desc:
        description: 版本说明（留空则用 upload: 时间）
        required: false
        type: string
      robot:
        description: CI 机器人编号 1-30
        required: false
        default: '1'
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Static checks
        run: |
          npm run test:cloud
          npm test

      - name: Write upload private key
        env:
          MP_CI_PRIVATE_KEY: ${{ secrets.MP_CI_PRIVATE_KEY }}
        run: |
          mkdir -p secrets
          if [ -z "$MP_CI_PRIVATE_KEY" ]; then
            echo "缺少 Secret: MP_CI_PRIVATE_KEY"
            exit 1
          fi
          printf '%s\n' "$MP_CI_PRIVATE_KEY" > secrets/private.wx61ad70ac766e4a04.key

      - name: Upload
        env:
          MP_CI_VERSION: ${{ inputs.version }}
          MP_CI_DESC: ${{ inputs.desc }}
          MP_CI_ROBOT: ${{ inputs.robot }}
        run: npm run mp:upload

      - name: Reminder
        run: echo "上传的是开发版本。请到微信公众平台 → 版本管理 → 选为体验版。"
